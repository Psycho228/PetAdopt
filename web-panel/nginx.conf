events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name hvostiki-admpan.online;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name hvostiki-admpan.online;

        root /var/www/petadopt;
        index index.html;

        # Proxy Supabase Auth
        location /auth/ {
            proxy_pass http://89.111.143.6:8000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Supabase REST (PostgREST)
        location /rest/ {
            proxy_pass http://89.111.143.6:8000/rest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Supabase Storage
        location /storage/ {
            proxy_pass http://89.111.143.6:8000/storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Supabase Realtime (WebSocket)
        location /realtime/v1/ {
            proxy_pass http://89.111.143.6:8000/realtime/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        ssl_certificate /etc/letsencrypt/live/hvostiki-admpan.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hvostiki-admpan.online/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }
}
